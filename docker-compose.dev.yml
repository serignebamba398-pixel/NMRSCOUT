# Compose v2 n'a plus besoin de "version:"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        - NODE_ENV=development
    container_name: nmr-backend-dev
    restart: unless-stopped
    
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DEBUG_MEMORY=true
      - DEBUG_PROCESSES=true
      - DEBUG_SSE=true
    env_file:
      - backend/.env.docker
    
    ports:
      - "4000:4000"
    
    volumes:
      - ./backend:/app/backend:rw
      - backend_node_modules:/app/backend/node_modules
      - backend_uploads:/app/backend/uploads
      - backend_outputs:/app/backend/outputs
      - backend_cache:/app/backend/cache
    
    command: >
      sh -c "
        cd /app/backend &&
        npm install &&
        npx nodemon --watch . --ext js,json server.js
      "
    
    networks:
      - nmr-network-dev
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
  
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: build
      args:
        - REACT_APP_API_URL=http://localhost:4000
    container_name: nmr-frontend-dev
    restart: unless-stopped
    
    environment:
      - REACT_APP_API_URL=http://localhost:4000
      - CHOKIDAR_USEPOLLING=true
    
    ports:
      - "3000:3000"
    
    volumes:
      - ./frontend:/app:rw
      - frontend_node_modules:/app/node_modules
      - frontend_build_cache:/app/.cache
    
    command: >
      sh -c "
        npm install &&
        npm start
      "
    
    depends_on:
      - backend
    
    networks:
      - nmr-network-dev
    
    stdin_open: true
    tty: true

volumes:
  backend_uploads:
    driver: local
  backend_outputs:
    driver: local
  backend_cache:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_build_cache:
    driver: local

networks:
  nmr-network-dev:
    driver: bridge
    name: nmr-network-dev