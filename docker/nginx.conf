# ==========================================
# Configuration Nginx pour l'application NMR
# VERSION CORRIGÉE - Backend avec préfixe /api/
# ==========================================

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

upstream backend_upstream {
    server backend:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/javascript;

    # ==========================================
    # SSE (Server-Sent Events)
    # 🔧 PAS DE REWRITE - le backend gère /api/ lui-même
    # ==========================================
    location ~ ^/api/(run-annotation(-from-prediction)?|predict/start|spectral-bg/(interact|interactive|zoom|relevel|export)) {
        limit_req zone=api_limit burst=5 nodelay;

        # 🔧 PROXY DIRECT - pas de rewrite
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Crucial pour SSE
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;

        chunked_transfer_encoding off;
        tcp_nopush off;
        tcp_nodelay on;

        client_max_body_size 500M;

        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    # ==========================================
    # Polling status des tâches
    # 🔧 PAS DE REWRITE
    # ==========================================
    location ^~ /api/tasks/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 30s;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # ==========================================
    # /api/outputs/ doit rester spécial car backend sert sur /outputs/
    # 🔧 REWRITE UNIQUEMENT ICI
    # ==========================================
    location ^~ /api/outputs/ {
        # Remplace /api/outputs/ par /outputs/ côté backend
        rewrite ^/api/outputs/(.*)$ /outputs/$1 break;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_cache STATIC;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        client_max_body_size 500M;
    }

    # ==========================================
    # Proxy API général
    # 🔧 PAS DE REWRITE - le backend gère /api/
    # ==========================================
    # Remplacer dans nginx.conf :

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        # ✅ PAS DE REWRITE - le backend attend /api/
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 500M;

        proxy_cache_bypass $http_upgrade;
        
        add_header X-Backend-Route $uri always;
    }

    # ==========================================
    # Fichiers statiques /outputs (sans /api/)
    # ==========================================
    location /outputs/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache STATIC;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ==========================================
    # Application React (SPA routing)
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }

    # ==========================================
    # Healthcheck (frontend)
    # ==========================================
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ==========================================
    # Interdire l'accès aux fichiers sensibles
    # ==========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ \.env {
        deny all;
        access_log off;
        log_not_found off;
    }
}