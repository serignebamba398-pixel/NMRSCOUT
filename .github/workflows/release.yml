name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download ML models
        shell: powershell
        env:
          MODELS_ZIP_URL: ${{ secrets.MODELS_ZIP_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $modelsDir = "backend/models"
          if (-not (Test-Path $modelsDir)) { New-Item -ItemType Directory -Path $modelsDir -Force }

          # Check if models already exist and are real (not LFS pointers)
          $existingModels = Get-ChildItem "$modelsDir/*.pt" -ErrorAction SilentlyContinue
          $needDownload = $false
          if ($existingModels) {
            foreach ($m in $existingModels) {
              if ($m.Length -lt 1000000) {
                Write-Host "$($m.Name) is only $($m.Length) bytes (LFS pointer) - need to download"
                $needDownload = $true
                break
              }
            }
          } else {
            $needDownload = $true
          }

          if (-not $needDownload) {
            Write-Host "Models already present and valid"
            exit 0
          }

          if (-not $env:MODELS_ZIP_URL) {
            throw "Secret MODELS_ZIP_URL not set"
          }

          $zip = Join-Path $env:RUNNER_TEMP "models.zip"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "User-Agent" = "github-actions"
          }

          Write-Host "Downloading models from release assets..."
          try {
            Invoke-WebRequest -Uri $env:MODELS_ZIP_URL -OutFile $zip -Headers $headers -MaximumRedirection 10
          } catch {
            Write-Warning "Direct download failed, trying gh CLI..."
            gh release download assets -p "models.zip" -D "$env:RUNNER_TEMP" -R "$env:GITHUB_REPOSITORY"
          }

          if (-not (Test-Path $zip)) {
            throw "Failed to download models.zip"
          }

          Write-Host "Extracting models and data..."
          $tempExtract = Join-Path $env:RUNNER_TEMP "models-extract"
          Expand-Archive -Path $zip -DestinationPath $tempExtract -Force

          # Move .pt files to backend/models/
          Get-ChildItem "$tempExtract/*.pt" | ForEach-Object {
            Copy-Item $_.FullName -Destination $modelsDir -Force
            Write-Host "Model: $($_.Name) -> $modelsDir"
          }

          # Move .npz files to backend/ml_dependencies/data/
          $dataDir = "backend/ml_dependencies/data"
          if (-not (Test-Path $dataDir)) { New-Item -ItemType Directory -Path $dataDir -Force }
          Get-ChildItem "$tempExtract/*.npz" | Where-Object { $_.Name -like "*graph*" } | ForEach-Object {
            Copy-Item $_.FullName -Destination $dataDir -Force
            Write-Host "Data: $($_.Name) -> $dataDir"
          }

          # Move sample .npz files to backend/ml_dependencies/
          $mlDir = "backend/ml_dependencies"
          Get-ChildItem "$tempExtract/sample_*.npz" | ForEach-Object {
            Copy-Item $_.FullName -Destination $mlDir -Force
            Write-Host "Sample: $($_.Name) -> $mlDir"
          }

          # Move .jar files to backend/ml_dependencies/
          Get-ChildItem "$tempExtract/*.jar" | ForEach-Object {
            Copy-Item $_.FullName -Destination $mlDir -Force
            Write-Host "JAR: $($_.Name) -> $mlDir"
          }

          # Move .pkl files to backend/ml_dependencies/data/
          Get-ChildItem "$tempExtract/*.pkl" | ForEach-Object {
            Copy-Item $_.FullName -Destination $dataDir -Force
            Write-Host "PKL: $($_.Name) -> $dataDir"
          }

          # Move .sd files to backend/ml_dependencies/data/
          Get-ChildItem "$tempExtract/*.sd" | ForEach-Object {
            Copy-Item $_.FullName -Destination $dataDir -Force
            Write-Host "SD: $($_.Name) -> $dataDir"
          }

          # Verify models
          $models = Get-ChildItem "$modelsDir/*.pt"
          foreach ($m in $models) {
            $sizeMB = [math]::Round($m.Length/1MB, 2)
            Write-Host "$($m.Name): $sizeMB MB"
            if ($m.Length -lt 1000000) {
              throw "Model $($m.Name) is too small ($($m.Length) bytes)"
            }
          }
          Write-Host "Models and data downloaded successfully!"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python build deps
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $py = "${{ steps.setup-python.outputs.python-path }}"
          if (-not $py) { throw "setup-python did not provide python-path" }
          Write-Host "Using Python: $py"
          & $py -c "import sys; print(sys.executable)"

          & $py -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed ($LASTEXITCODE)" }

          & $py -m pip install -r backend/requirements.cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw "pip install requirements failed ($LASTEXITCODE)" }

          & $py -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "pip install pyinstaller failed ($LASTEXITCODE)" }

          & $py -m pip --version

          & $py -m pip show numpy
          if ($LASTEXITCODE -ne 0) { throw "numpy not installed after requirements install" }

          & $py -c "import numpy as np; print('numpy', np.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "numpy import failed" }

      - name: Sanity check Python deps
        shell: powershell
        run: |
          $py = "${{ steps.setup-python.outputs.python-path }}"
          & $py -c "import numpy as np; print('numpy', np.__version__)"

      - name: Install Node deps (root)
        run: npm ci

      - name: Install Node deps (frontend)
        run: npm ci --prefix frontend

      - name: Download R-Portable
        shell: powershell
        env:
          R_ZIP_URL: ${{ secrets.R_PORTABLE_ZIP_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path "R-Portable\bin\Rscript.exe") {
            Write-Host "R-Portable already present."
            exit 0
          }
          if (-not $env:R_ZIP_URL) {
            Write-Error "Secret R_PORTABLE_ZIP_URL not set."
          }
          $zip = Join-Path $env:RUNNER_TEMP "R-Portable.zip"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "User-Agent" = "github-actions"
          }

          Write-Host "Downloading R-Portable from: $env:R_ZIP_URL"

          try {
            Invoke-WebRequest -Uri $env:R_ZIP_URL -OutFile $zip -Headers $headers -MaximumRedirection 10
          } catch {
            Write-Warning ("Download failed: " + $_.Exception.Message)
            if ($_.Exception.Response) {
              try { Write-Warning ("HTTP status: " + $_.Exception.Response.StatusCode.value__) } catch {}
            }
            Write-Warning "Falling back to GitHub CLI download (private-safe)..."
            gh --version
            # Download from the 'assets' release tag by pattern (requires the asset to be named R-Portable.zip)
            gh release download assets -p "R-Portable.zip" -D "$env:RUNNER_TEMP" -R "$env:GITHUB_REPOSITORY"
            if (-not (Test-Path $zip)) {
              throw "Failed to download R-Portable.zip via URL and via gh. Ensure the release tag 'assets' exists and contains an asset named R-Portable.zip."
            }
          }
          Expand-Archive -Path $zip -DestinationPath . -Force
          if (-not (Test-Path "R-Portable\bin\Rscript.exe")) {
            throw "R-Portable extraction failed."
          }

      - name: Build Python bundle (PyInstaller)
        shell: powershell
        env:
          PYTHON_EXE: ${{ steps.setup-python.outputs.python-path }}
        run: npm run build:python

      - name: Build frontend
        run: npm run build:frontend
        env:
          CI: false

      - name: Verify assets
        run: node scripts/verify_assets.js --strict --release

      - name: Build Electron package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Create portable ZIP
        shell: powershell
        run: |
          $unpackedDir = "dist\win-unpacked"
          if (-not (Test-Path $unpackedDir)) {
            throw "win-unpacked folder not found"
          }
          $zipPath = "dist\NMRScout-${{ github.ref_name }}-portable.zip"
          Write-Host "Creating portable ZIP: $zipPath"
          Compress-Archive -Path "$unpackedDir\*" -DestinationPath $zipPath -Force
          Write-Host "ZIP created: $((Get-Item $zipPath).Length / 1MB) MB"

      - name: Verify dist artifacts
        shell: powershell
        run: |
          if (-not (Test-Path "dist")) { throw "dist/ folder not found" }
          $exes = Get-ChildItem -Path "dist" -Filter "*.exe" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "*.blockmap" }
          $zips = Get-ChildItem -Path "dist" -Filter "*-portable.zip" -File -ErrorAction SilentlyContinue
          if (-not $exes -or $exes.Count -lt 1) {
            Get-ChildItem -Path "dist" -Force
            throw "No .exe artifacts found in dist/"
          }
          Write-Host "EXE Artifacts:"; $exes | Select-Object Name, @{N='Size(MB)';E={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize
          Write-Host "ZIP Artifacts:"; $zips | Select-Object Name, @{N='Size(MB)';E={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*Setup*.exe
            dist/*-portable.zip
