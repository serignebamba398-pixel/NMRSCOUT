name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_ext: exe
            r_secret: R_PORTABLE_ZIP_URL_WIN
            python_secret: PYTHON_ENGINE_ZIP_URL_WIN
            rscript_check: R-Portable/bin/Rscript.exe
            python_check: nmr_engine_production.exe
          - os: ubuntu-latest
            artifact_ext: AppImage
            r_secret: R_PORTABLE_ZIP_URL_LINUX
            python_secret: PYTHON_ENGINE_ZIP_URL_LINUX
            rscript_check: R-Portable/bin/Rscript
            python_check: nmr_engine_production
          - os: macos-latest
            artifact_ext: dmg
            r_secret: R_PORTABLE_ZIP_URL_MAC
            python_secret: PYTHON_ENGINE_ZIP_URL_MAC
            rscript_check: R-Portable/bin/Rscript
            python_check: nmr_engine_production

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python build deps (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyinstaller

      - name: Install Python build deps (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyinstaller

      - name: Install Node deps (root)
        run: npm ci

      - name: Install Node deps (frontend)
        run: npm ci --prefix frontend

      # -----------------------------------------------------------------
      # Download R-Portable bundle (from OS-specific secret URL)
      # -----------------------------------------------------------------
      - name: Download R-Portable (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          R_ZIP_URL: ${{ secrets[matrix.r_secret] }}
        run: |
          if (Test-Path "${{ matrix.rscript_check }}") {
            Write-Host "R-Portable already present."
            exit 0
          }
          if (-not $env:R_ZIP_URL) {
            Write-Error "Secret ${{ matrix.r_secret }} not set."
          }
          $zip = Join-Path $env:RUNNER_TEMP "R-Portable.zip"
          Invoke-WebRequest -Uri $env:R_ZIP_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath . -Force
          if (-not (Test-Path "${{ matrix.rscript_check }}")) {
            throw "R-Portable extraction failed."
          }

      - name: Download R-Portable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          R_ZIP_URL: ${{ secrets[matrix.r_secret] }}
        run: |
          if [ -f "${{ matrix.rscript_check }}" ]; then
            echo "R-Portable already present."
            exit 0
          fi
          if [ -z "$R_ZIP_URL" ]; then
            echo "::error::Secret ${{ matrix.r_secret }} not set."
            exit 1
          fi
          curl -fsSL "$R_ZIP_URL" -o /tmp/R-Portable.zip
          unzip -q /tmp/R-Portable.zip -d .
          if [ ! -f "${{ matrix.rscript_check }}" ]; then
            echo "::error::R-Portable extraction failed."
            exit 1
          fi

      # -----------------------------------------------------------------
      # Download prebuilt Python engine bundle (optional; fallback to PyInstaller)
      # -----------------------------------------------------------------
      - name: Download Python Engine (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          PY_ZIP_URL: ${{ secrets[matrix.python_secret] }}
        run: |
          $target = "resources/python/${{ matrix.python_check }}"
          if (Test-Path $target) {
            Write-Host "Python engine already present."
            exit 0
          }
          if (-not $env:PY_ZIP_URL) {
            Write-Host "No prebuilt Python engine; will build with PyInstaller."
            exit 0
          }
          $zip = Join-Path $env:RUNNER_TEMP "python-engine.zip"
          Invoke-WebRequest -Uri $env:PY_ZIP_URL -OutFile $zip
          New-Item -ItemType Directory -Force -Path "resources/python" | Out-Null
          Expand-Archive -Path $zip -DestinationPath "resources/python" -Force
          Write-Host "Python engine downloaded."

      - name: Download Python Engine (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PY_ZIP_URL: ${{ secrets[matrix.python_secret] }}
        run: |
          target="resources/python/${{ matrix.python_check }}"
          if [ -f "$target" ]; then
            echo "Python engine already present."
            exit 0
          fi
          if [ -z "$PY_ZIP_URL" ]; then
            echo "No prebuilt Python engine; will build with PyInstaller."
            exit 0
          fi
          mkdir -p resources/python
          curl -fsSL "$PY_ZIP_URL" -o /tmp/python-engine.zip
          unzip -q /tmp/python-engine.zip -d resources/python
          echo "Python engine downloaded."

      # -----------------------------------------------------------------
      # Build Python bundle (PyInstaller) – only if not already present
      # -----------------------------------------------------------------
      - name: Build Python bundle (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          PYTHON_EXE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          $prebuilt = "resources/python/${{ matrix.python_check }}"
          if (Test-Path $prebuilt) {
            Write-Host "Skipping PyInstaller – prebuilt engine exists."
            exit 0
          }
          npm run build:python

      - name: Build Python bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PYTHON_EXE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          prebuilt="resources/python/${{ matrix.python_check }}"
          if [ -f "$prebuilt" ]; then
            echo "Skipping PyInstaller – prebuilt engine exists."
            exit 0
          fi
          # PyInstaller build script – adapt for Unix (assumes a shell-based script or direct call)
          cd backend
          python -m PyInstaller --clean --noconfirm nmr_engine_production.spec
          cd ..

      - name: Build frontend
        run: npm run build:frontend

      - name: Verify assets
        run: node scripts/verify_assets.js --strict --release

      - name: Build Electron package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      # -----------------------------------------------------------------
      # Verify artifacts and publish
      # -----------------------------------------------------------------
      - name: Verify dist artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Test-Path "dist")) { throw "dist/ folder not found" }
          $arts = Get-ChildItem -Path "dist" -Filter "*.${{ matrix.artifact_ext }}" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "*.blockmap" }
          if (-not $arts -or $arts.Count -lt 1) {
            Get-ChildItem -Path "dist" -Force
            throw "No .${{ matrix.artifact_ext }} artifacts found in dist/"
          }
          Write-Host "Artifacts:"; $arts | Select-Object Name, Length | Format-Table -AutoSize

      - name: Verify dist artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ ! -d "dist" ]; then echo "dist/ folder not found"; exit 1; fi
          count=$(find dist -maxdepth 1 -name "*.${{ matrix.artifact_ext }}" -type f | wc -l)
          if [ "$count" -lt 1 ]; then
            ls -la dist
            echo "::error::No .${{ matrix.artifact_ext }} artifacts found in dist/"
            exit 1
          fi
          echo "Artifacts:"
          ls -lh dist/*.${{ matrix.artifact_ext }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.${{ matrix.artifact_ext }}
            dist/*.zip
