name: Docker Publish (Multi-Arch)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. v3, v4, latest)"
        required: true
        default: "v1"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Extract tag name from ref (refs/tags/v1.0.0 -> v1.0.0)
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download ML data for Docker build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Downloading models.zip from release assets..."
          asset_id="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/serignebamba398-pixel/annotation-nmr/releases/tags/assets" \
            | jq -er '.assets[] | select(.name == "models.zip") | .id')"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o models.zip \
            "https://api.github.com/repos/serignebamba398-pixel/annotation-nmr/releases/assets/${asset_id}"

          if ! unzip -tq models.zip; then
            echo "::error::Downloaded models.zip is not a valid ZIP archive."
            exit 1
          fi

          echo "Extracting to backend directories..."
          mkdir -p backend/models backend/ml_dependencies/data

          unzip -o models.zip -d /tmp/models-extract

          # Move files to correct locations
          find /tmp/models-extract -type f -name '*.pt' -exec cp -t backend/models/ {} +
          find /tmp/models-extract -type f -name '*graph*.npz' -exec cp -t backend/ml_dependencies/data/ {} +
          find /tmp/models-extract -type f -name 'sample_*.npz' -exec cp -t backend/ml_dependencies/ {} +
          find /tmp/models-extract -type f -name '*.jar' -exec cp -t backend/ml_dependencies/ {} +
          find /tmp/models-extract -type f -name '*.pkl' -exec cp -t backend/ml_dependencies/data/ {} +
          find /tmp/models-extract -type f -name '*.sd' -exec cp -t backend/ml_dependencies/data/ {} +

          test -s backend/ml_dependencies/data/fingerprint_database.pkl || {
            echo "::error::models.zip did not provide fingerprint_database.pkl"
            exit 1
          }
          test -s backend/models/1H_sparsified_proposed_proposed_set2set_1.pt || {
            echo "::error::models.zip did not provide the 1H model"
            exit 1
          }
          test -s backend/models/13C_sparsified_proposed_proposed_set2set_1.pt || {
            echo "::error::models.zip did not provide the 13C model"
            exit 1
          }

          echo "Files ready for Docker build:"
          find backend/models backend/ml_dependencies/data -maxdepth 1 -type f -printf '%p (%s bytes)\n'
          find backend/ml_dependencies -maxdepth 1 -type f -name '*.jar' -printf '%p (%s bytes)\n'

      - name: Build & push backend (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/serignebamba398/annotation-nmr-backend:${{ steps.version.outputs.tag }}
            docker.io/serignebamba398/annotation-nmr-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/serignebamba398/annotation-nmr-frontend:${{ steps.version.outputs.tag }}
            docker.io/serignebamba398/annotation-nmr-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify multi-arch manifests
        run: |
          echo "=== Backend manifest ==="
          docker buildx imagetools inspect serignebamba398/annotation-nmr-backend:${{ steps.version.outputs.tag }}
          echo ""
          echo "=== Frontend manifest ==="
          docker buildx imagetools inspect serignebamba398/annotation-nmr-frontend:${{ steps.version.outputs.tag }}
