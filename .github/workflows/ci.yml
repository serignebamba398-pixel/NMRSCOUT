name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: false

  backend_node:
    name: Backend Node (install + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Smoke test /health
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4000
          export LOG_DIR="$RUNNER_TEMP/backend-logs"
          export NODE_ENV=production
          mkdir -p "$LOG_DIR"
          node server.js >"$RUNNER_TEMP/backend.stdout.log" 2>"$RUNNER_TEMP/backend.stderr.log" &
          pid=$!
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null; then
              echo "Backend OK"
              kill "$pid" || true
              wait "$pid" || true
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to become ready"
          echo "--- backend stdout ---"; cat "$RUNNER_TEMP/backend.stdout.log" || true
          echo "--- backend stderr ---"; cat "$RUNNER_TEMP/backend.stderr.log" || true
          kill "$pid" || true
          wait "$pid" || true
          exit 1

  python_smoke:
    name: Python (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python files
        run: python -m compileall backend
