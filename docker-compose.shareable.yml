# ==========================================
# NMRScout - Docker Compose (distributable)
# Cross-platform: Windows, macOS, Linux
# ==========================================
# Usage:
#   1. Copy .env.example to .env (adjust if needed)
#   2. docker compose -f docker-compose.shareable.yml up -d
#   3. Open http://localhost:3000
# ==========================================

services:
  backend:
    image: docker.io/serignebamba398/annotation-nmr-backend:latest
    container_name: nmr-backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${BACKEND_PORT:-4000}:4000"

    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_outputs:/app/backend/outputs
      - backend_cache:/app/backend/cache
      # Les volumes pour accéder aux spectres Bruker sont dans
      # docker-compose.volumes.yml (généré par install.bat / install.sh)

    networks:
      - nmr-network

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: docker.io/serignebamba398/annotation-nmr-frontend:latest
    container_name: nmr-frontend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - nmr-network

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend_uploads:
    driver: local
    name: nmr_uploads
  backend_outputs:
    driver: local
    name: nmr_outputs
  backend_cache:
    driver: local
    name: nmr_cache

networks:
  nmr-network:
    driver: bridge
    name: nmr-network
